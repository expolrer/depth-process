[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-interaction-auto-labeler-v2"
version = "0.1.0"
description = "Task-conditioned multi-view robot interaction auto-labeler"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
grounded-sam2 = ["torch>=2.6", "transformers>=4.56"]
sam3 = ["torch>=2.7"]
test = ["pytest>=8"]

[project.scripts]
auto-labeler-v2 = "interaction_auto_labeler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_auto_labeler"]

[tool.pytest.ini_options]
pythonpath = ["src", "../interaction-labeler-v1/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
