name: toy_pile_single_instance
instruction: Pick up the intended red plush toy from the middle pile and move it to the right side.
target:
  names: [red plush toy, toy]
  attributes: [red, plush, small]
  source_region: middle toy pile
  destination_region: right side of table
  # 可选的头部 RGB 像素区域；提供后才启用严格的源区到目的区证据。
  source_box_xyxy: null
  destination_box_xyxy: null
  negative_descriptions: [yellow toy, robot gripper, stationary red toys]
  exemplar_images: []
detector_prompt: [red plush toy, toy, robotic gripper, tabletop]
active_hand: auto
camera_roles:
  head: [cam_h, head, observation.images.head]
  left_wrist: [cam_l, left_wrist, observation.images.left_wrist]
  right_wrist: [cam_r, right_wrist, observation.images.right_wrist]
event_detection:
  pre_frames: 45
  post_release_frames: 20
  max_span: 240
v2:
  detector_backend: grounded-sam2
  inventory_stride: 10
  ambiguity_margin: 0.08
  cross_view_mode: soft
  calibration: null
  weights:
    contact: 0.30
    co_motion: 0.25
    start_end_displacement: 0.20
    source_destination: 0.10
    descriptor_match: 0.10
    cross_view: 0.05
  review:
    max_area_jump: 2.5
    min_track_visibility: 0.80
    max_projection_error_px: 18.0
