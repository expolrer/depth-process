version: 1
mode: rgbd_paired
seed: 20260820

RGB_Augmenter:
  enable: true
  max_num_transforms: 1
  random_order: true
  tfs:
    notransform:
      weight: 3.0
      type: Identity
      kwargs: {}
    brightness:
      weight: 1.0
      type: ColorJitter
      kwargs: {brightness: [0.5, 1.5]}
    contrast:
      weight: 1.0
      type: ColorJitter
      kwargs: {contrast: [0.5, 1.5]}
    saturation:
      weight: 1.0
      type: ColorJitter
      kwargs: {saturation: [0.5, 1.5]}
    hue:
      weight: 1.0
      type: ColorJitter
      kwargs: {hue: [-0.05, 0.05]}
    sharpness:
      weight: 1.0
      type: SharpnessJitter
      kwargs: {sharpness: [0.5, 1.5]}
    random_mask:
      weight: 1.0
      type: RandomMask
      kwargs:
        mask_size: [0.1, 0.1]
    random_border_cutout:
      weight: 1.0
      type: RandomBorderCutout
      kwargs:
        cut_ratio: 0.15
    gaussian_noise:
      weight: 1.0
      type: GaussianNoise
      kwargs:
        mean: 0.0
        std: 0.05
    gamma_correction:
      weight: 1.0
      type: GammaCorrection
      kwargs:
        gamma: [0.5, 2.0]

Depth_Augmenter:
  mode: paired_spatial
  photometric_policy: preserve_metric_depth
  paired_spatial_transforms:
    - random_mask
    - random_border_cutout
  invalid_value: 0
