[project]
name = "hhw-depth-processing"
version = "0.1.0"
description = "Offline RGB-D extraction and depth refinement for ROS1 bags"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "Pillow>=10",
  "PyYAML>=6",
  "rosbags>=0.10.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
lingbot = ["torch>=2.6", "torchvision", "timm", "einops", "trimesh"]
cdm = ["torch>=2.6", "torchvision", "timm", "einops"]

[tool.ruff]
line-length = 100
target-version = "py310"
