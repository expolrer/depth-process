[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-interaction-labeler"
version = "0.1.0"
description = "Human-in-the-loop RGB-D robot interaction annotation pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
rosbag = ["rosbags>=0.10.7"]
lerobot = ["pyarrow>=16"]
models = [
  "torch>=2.6",
  "torchvision",
  "transformers>=4.56",
  "qwen-vl-utils",
]
test = ["pytest>=8"]

[project.scripts]
interaction-labeler = "interaction_labeler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_labeler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
